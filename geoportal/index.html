<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoportal Lotniczy Polski - PRO</title>

    <link rel="stylesheet" href="osmdatapicker-page.css" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@2.9.8/dist/leaflet-search.src.css" />

    <link rel="stylesheet" href="https://ppete2.github.io/Leaflet.PolylineMeasure/Leaflet.PolylineMeasure.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        #map { width: 100%; height: 100vh; background: #222; } /* Ciemne tło zanim mapa się załaduje */
        
        /* --- EFEKT GLASSMORPHISM (Nowoczesny Tytuł) --- */
        .map-title {
            position: absolute;
            top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; 
            background: rgba(255, 255, 255, 0.85); /* Półprzezroczystość */
            backdrop-filter: blur(10px); /* Rozmycie tła pod spodem */
            padding: 10px 30px; 
            border-radius: 50px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.18);
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .map-title h1 { 
            margin: 0; font-size: 24px; color: #2c3e50; 
            text-transform: uppercase; letter-spacing: 2px; font-weight: 800;
            background: -webkit-linear-gradient(#1e3c72, #2a5298);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .map-title span { font-size: 11px; color: #555; display: block; margin-top: 4px; font-weight: 600; text-transform: uppercase; }

        /* --- ANIMACJA PULSOWANIA DLA KOMERCYJNYCH --- */
        @keyframes pulse-red {
            0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(214, 48, 49, 0.7)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(214, 48, 49, 0.4)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(214, 48, 49, 0)); }
        }
        
        .plane-icon { background: transparent; border: none; }
        .plane-icon svg { filter: drop-shadow(3px 5px 2px rgba(0,0,0,0.3)); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .plane-icon:hover svg { transform: scale(1.5) rotate(-10deg); z-index: 999; }

        /* Klasa dla pulsujących samolotów */
        .pulsing-icon svg { animation: pulse-red 2s infinite; }

        /* --- LEGENDA (Styl Glass) --- */
        .legend { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(5px);
            padding: 15px; color: #333; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            font-size: 13px; min-width: 150px; 
            border: 1px solid rgba(255,255,255,0.5);
        }
        .legend h4 { margin: 0 0 10px 0; font-size: 14px; font-weight: bold; border-bottom: 2px solid #ddd; padding-bottom: 5px; text-transform: uppercase; }
        .legend div { display: flex; align-items: center; margin-bottom: 8px; font-weight: 500; }
        .legend svg { width: 22px; height: 22px; margin-right: 10px; filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.2)); }

        /* --- POPUPY (Styl Glass) --- */
        .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .leaflet-popup-tip { background: rgba(255, 255, 255, 0.95); }
        
        .custom-popup { font-size: 13px; max-width: 320px; font-family: 'Segoe UI', sans-serif; }
        .custom-popup h3 { 
            margin: 0 0 10px 0; color: #2c3e50; font-size: 18px; 
            border-bottom: 3px solid #3498db; padding-bottom: 5px; 
            font-weight: 700;
        }
        
        /* Ramka z kodami */
        .codes-box { 
            background: linear-gradient(145deg, #f8f9fa, #e9ecef); 
            border-left: 4px solid #3498db;
            border-radius: 4px; padding: 8px 12px; margin-bottom: 12px; 
            display: flex; gap: 15px; 
        }
        .code-item { display: flex; flex-direction: column; }
        .code-label { color: #7f8c8d; font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .code-value { font-family: 'Consolas', monospace; font-weight: bold; color: #2c3e50; font-size: 14px; }

        .popup-photo { 
            width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.15); display: block; background-color: #eee; 
            transition: transform 0.3s;
        }
        .popup-photo:hover { transform: scale(1.02); }
        .hidden-photo { display: none !important; }

        /* PRZYCISKI */
        .popup-btn {
            display: block; width: 100%; padding: 10px 0; margin-top: 8px;
            text-align: center; text-decoration: none; border-radius: 6px;
            font-size: 12px; font-weight: 700; cursor: pointer; border: none;
            transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-radar { background-color: #febc11; color: #222 !important; border: 1px solid #d49a00; }
        .btn-radar:hover { background-color: #ffce4b; transform: translateY(-2px); }
        
        .btn-wiki { background-color: #3498db; color: white !important; }
        .btn-wiki:hover { background-color: #5dade2; transform: translateY(-2px); }

        /* PRZYCISK LOKALIZACJI */
        .locate-btn {
            background-color: white; width: 34px; height: 34px;
            border-radius: 5px; border: 2px solid #ccc; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #333; box-shadow: 0 1px 5px rgba(0,0,0,0.65);
        }
        .locate-btn:hover { background-color: #f4f4f4; color: #3498db; }

        @media (max-width: 600px) { .map-title { top: 10px; padding: 8px 15px; width: 70%; } .map-title h1 { font-size: 16px; } }
        
        /* Fix ikony OSM Data Picker */
        .leaflet-control-osmdatapicker { background-image: url('assets/openstreetmap.svg') !important; background-size: 24px 24px; background-repeat: no-repeat; background-position: center; background-color: white !important; width: 34px !important; height: 34px !important; border: 2px solid #ccc; border-radius: 5px; box-shadow: 0 1px 5px rgba(0,0,0,0.65); cursor: pointer; }
    </style>
</head>

                { "type": "Feature", "properties": { "nazwa": "Jelenia Góra", "kodICAO": "EPJG", "kodIATA": "-", "opis": "Aeroklub Jeleniogórski.", "foto": "https://upload.wikimedia.org/wikipedia/commons/8/83/Lotnisko_Jelenia_G%C3%B3ra.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/Lotnisko_Jelenia_G%C3%B3ra" }, "geometry": { "type": "Point", "coordinates": [15.7852, 50.8986] } },
                { "type": "Feature", "properties": { "nazwa": "Arłamów", "kodICAO": "EPAR", "kodIATA": "-", "opis": "Lądowisko hotelowe.", "foto": "https://upload.wikimedia.org/wikipedia/commons/f/f6/Arlamow_2022_06.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/L%C4%85dowisko_Ar%C5%82am%C3%B3w" }, "geometry": { "type": "Point", "coordinates": [22.5158, 49.6586] } }
            ]
        };

        var historyczneGeoJSON = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "nazwa": "Kraków Rakowice-Czyżyny", "kodICAO": "EPKC", "kodIATA": "n/d", "opis": "Muzeum Lotnictwa Polskiego.", "foto": "https://upload.wikimedia.org/wikipedia/commons/7/7e/Krakow_Rakowice_Czyzyny_Airport.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/Lotnisko_Krak%C3%B3w-Rakowice-Czy%C5%BCyny" }, "geometry": { "type": "Point", "coordinates": [19.9900, 50.0760] } },
                { "type": "Feature", "properties": { "nazwa": "Warszawa Mokotów", "kodICAO": "n/d", "kodIATA": "n/d", "opis": "Główny port Warszawy do 1934.", "foto": "https://upload.wikimedia.org/wikipedia/commons/c/c3/Pole_Mokotowskie_1935_port_lotniczy.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/Lotnisko_Mokotowskie" }, "geometry": { "type": "Point", "coordinates": [21.0000, 52.2100] } },
                { "type": "Feature", "properties": { "nazwa": "Gdańsk Wrzeszcz", "kodICAO": "EPGD", "kodIATA": "GDN", "opis": "Działało do 1974. Obecnie osiedle.", "foto": "https://upload.wikimedia.org/wikipedia/commons/1/1f/Flughafen_Danzig-Langfuhr_1941.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/Lotnisko_Gda%C5%84sk-Wrzeszcz" }, "geometry": { "type": "Point", "coordinates": [18.5996, 54.3925] } },
                { "type": "Feature", "properties": { "nazwa": "Gdynia w Rumi-Zagórzu", "kodICAO": "n/d", "kodIATA": "n/d", "opis": "Główny port Gdyni w latach 1935-1939.", "foto": "https://upload.wikimedia.org/wikipedia/commons/c/c5/Rumia-Zag%C3%B3rze_lotnisko.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/Port_lotniczy_Gdynia_w_Rumi-Zag%C3%B3rzu" }, "geometry": { "type": "Point", "coordinates": [18.3861, 54.5827] } },
                { "type": "Feature", "properties": { "nazwa": "Wrocław Gądów Mały", "kodICAO": "n/d", "kodIATA": "n/d", "opis": "Obecnie osiedle.", "foto": "https://upload.wikimedia.org/wikipedia/commons/6/61/Wroclaw_ul_Lotnicza_Budynek_portu_lotniczego_1.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/Lotnisko_Wroc%C5%82aw-G%C4%85d%C3%B3w_Ma%C5%82y" }, "geometry": { "type": "Point", "coordinates": [16.9700, 51.1200] } },
                { "type": "Feature", "properties": { "nazwa": "Szczecin Dąbie", "kodICAO": "EPSD", "kodIATA": "n/d", "opis": "Pasażerskie do lat 60.", "foto": "https://upload.wikimedia.org/wikipedia/commons/5/57/Aeroklub_Szczecinski_hangar.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/Lotnisko_Szczecin-D%C4%85bie" }, "geometry": { "type": "Point", "coordinates": [14.6300, 53.3900] } },
                { "type": "Feature", "properties": { "nazwa": "Katowice Muchowiec (Hist.)", "kodICAO": "EPKM", "kodIATA": "n/d", "opis": "Ruch pasażerski do 1958.", "foto": "https://upload.wikimedia.org/wikipedia/commons/d/d6/Terminal_lotniska_Katowice-Muchowiec_1930.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/Lotnisko_Katowice-Muchowiec" }, "geometry": { "type": "Point", "coordinates": [19.0342, 50.2381] } },
                { "type": "Feature", "properties": { "nazwa": "Olsztyn Dajtki (Hist.)", "kodICAO": "EPOD", "kodIATA": "QYO", "opis": "Przed wojną Lufthansa.", "foto": "https://upload.wikimedia.org/wikipedia/commons/3/33/Lotnisko_Dajtki.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/Lotnisko_Olsztyn-Dajtki" }, "geometry": { "type": "Point", "coordinates": [20.4239, 53.7744] } },
                { "type": "Feature", "properties": { "nazwa": "Koszalin Zegrze", "kodICAO": "EPKO", "kodIATA": "OSZ", "opis": "Ruch 1965-1991.", "foto": "https://upload.wikimedia.org/wikipedia/commons/9/98/Zegrze_Pomorskie_Airport.JPG?width=800", "wiki": "https://pl.wikipedia.org/wiki/Lotnisko_Koszalin-Zegrze_Pomorskie" }, "geometry": { "type": "Point", "coordinates": [16.2600, 54.0400] } },
                { "type": "Feature", "properties": { "nazwa": "Słupsk Redzikowo", "kodICAO": "EPSK", "kodIATA": "OQL", "opis": "Loty do lat 90.", "foto": "https://upload.wikimedia.org/wikipedia/commons/1/19/Slupsk_Redzikowo_Airport.JPG?width=800", "wiki": "https://pl.wikipedia.org/wiki/Port_lotniczy_S%C5%82upsk-Redzikowo" }, "geometry": { "type": "Point", "coordinates": [17.1000, 54.4700] } },
                { "type": "Feature", "properties": { "nazwa": "Białystok Krywlany (Hist.)", "kodICAO": "EPBK", "kodIATA": "QYY", "opis": "Po 1945.", "foto": "https://upload.wikimedia.org/wikipedia/commons/5/5a/Lotnisko_Bia%C5%82ystok-Krywlany.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/Lotnisko_Bia%C5%82ystok-Krywlany" }, "geometry": { "type": "Point", "coordinates": [23.1731, 53.1044] } },
                { "type": "Feature", "properties": { "nazwa": "Częstochowa Rudniki (Hist.)", "kodICAO": "EPRU", "kodIATA": "CZW", "opis": "Sezonowe 1983.", "foto": "https://upload.wikimedia.org/wikipedia/commons/c/c3/Lotnisko_Rudniki.jpg?width=800", "wiki": "https://pl.wikipedia.org/wiki/Lotnisko_Cz%C4%99stochowa-Rudniki" }, "geometry": { "type": "Point", "coordinates": [19.2056, 50.8847] } }
            ]
        };

        // --- ULEPSZONA FUNKCJA POPUPÓW ---
        function createPopupContent(feature) {
            var props = feature.properties;
            var html = `<div class='custom-popup'>
                <h3>${props.nazwa}</h3>`;
            
            if (props.foto) {
                html += `<img src='${props.foto}' class='popup-photo' alt='${props.nazwa}' onerror="this.src='${fallbackImage}'">`;
            }
            
            html += `<div class='codes-box'>
                        <div class='code-item'><span class='code-label'>ICAO</span><span class='code-value'>${props.kodICAO || "n/d"}</span></div>
                        <div class='code-item'><span class='code-label'>IATA</span><span class='code-value'>${props.kodIATA || "-"}</span></div>
                     </div>
                     <i>${props.opis}</i><br>`;
            
            if (props.fr24) { 
                html += `<button onclick="openMiniWindow('${props.fr24}')" class='popup-btn btn-radar'><i class="fa-solid fa-plane-up"></i> Przyloty i Odloty (Live)</button>`; 
            }
            if (props.wiki) { 
                html += `<a href='${props.wiki}' target='_blank' class='popup-btn btn-wiki'>Zobacz na Wikipedii &rarr;</a>`; 
            }
            html += "</div>";
            return html;
        }

        function onEachPopup(feature, layer) { layer.bindPopup(createPopupContent(feature)); }

        // --- IKONY Z ANIMACJĄ ---
        function getPlaneIcon(color, pulse) {
            var pulseClass = pulse ? "pulsing-icon" : "";
            var svgPlane = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${color}" width="28" height="28"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>`;
            return L.divIcon({ 
                className: `plane-icon ${pulseClass}`, 
                html: svgPlane, 
                iconSize: [28, 28], 
                iconAnchor: [14, 14], 
                popupAnchor: [0, -10] 
            });
        }

        // Dodajemy parametr true dla komercyjnych (żeby pulsowały)
        function styleK(feature, latlng) { return L.marker(latlng, { icon: getPlaneIcon("#d63031", true) }); }
        function styleA(feature, latlng) { return L.marker(latlng, { icon: getPlaneIcon("#0984e3", false) }); }
        function styleH(feature, latlng) { return L.marker(latlng, { icon: getPlaneIcon("#636e72", false) }); }

        // --- WARSTWY ---
        var layerKomercyjne = L.geoJSON(komercyjneGeoJSON, { pointToLayer: styleK, onEachFeature: onEachPopup });
        var layerAeroklubowe = L.geoJSON(aerokluboweGeoJSON, { pointToLayer: styleA, onEachFeature: onEachPopup });
        var layerHistoryczne = L.geoJSON(historyczneGeoJSON, { pointToLayer: styleH, onEachFeature: onEachPopup });

        layerKomercyjne.addTo(map); layerAeroklubowe.addTo(map); layerHistoryczne.addTo(map);
        var wszystkieLotniska = L.layerGroup([layerKomercyjne, layerAeroklubowe, layerHistoryczne]);

        // Panel Warstw (z Trybem Nocnym)
        L.control.layers(
            { 
                "Mapa Drogowa": osmStandard, 
                "Satelita (Esri)": esriSatelita, 
                "Topograficzna": openTopo,
                "Radar Nocny 🌑": darkMatter 
            },
            { 
                "<span style='color:#d63031; font-weight:bold'>Pasażerskie</span>": layerKomercyjne, 
                "<span style='color:#0984e3; font-weight:bold'>Aeroklubowe</span>": layerAeroklubowe, 
                "<span style='color:#636e72; font-weight:bold'>Historyczne</span>": layerHistoryczne 
            }
        ).addTo(map);

        // --- LEGENDA ---
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<h4>Legenda</h4>';
            div.innerHTML += '<div><svg viewBox="0 0 24 24" fill="#d63031"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg> Pasażerskie (Live)</div>';
            div.innerHTML += '<div><svg viewBox="0 0 24 24" fill="#0984e3"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg> Aeroklubowe</div>';
            div.innerHTML += '<div><svg viewBox="0 0 24 24" fill="#636e72"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg> Historyczne</div>';
            return div;
        };
        legend.addTo(map);

        // --- PRZYCISK LOKALIZACJI (WOW FACTOR) ---
        var locateControl = L.Control.extend({
            options: { position: 'topleft' },
            onAdd: function(map) {
                var btn = L.DomUtil.create('button', 'locate-btn');
                btn.innerHTML = '📍';
                btn.title = "Gdzie jestem?";
                btn.onclick = function() {
                    map.locate({setView: true, maxZoom: 10});
                }
                return btn;
            }
        });
        map.addControl(new locateControl());

        // Obsługa lokalizacji
        map.on('locationfound', function(e) {
            L.circle(e.latlng, {radius: e.accuracy/2, color: '#2ecc71'}).addTo(map).bindPopup("Jesteś tutaj!").openPopup();
        });

        // Wtyczki
        var searchControl = new L.Control.Search({ layer: wszystkieLotniska, propertyName: 'nazwa', marker: false, moveToLocation: function(latlng, title, map) { map.setView(latlng, 14); } });
        map.addControl(searchControl);

        var miniMapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
        new L.Control.MiniMap(miniMapLayer, { toggleDisplay: true, minimized: false }).addTo(map);
        L.control.polylineMeasure({ position: 'topleft', unit: 'metres', showClearControl: true }).addTo(map);
        if (L.OSMDataPicker) { L.OSMDataPicker.addControl(map); }

    </script>
</body>
</html>
