<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wielofunkcyjny Geoportal Lotnisk</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="osmdatapicker-page.css" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@2.9.8/dist/leaflet-search.src.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-minimap/3.6.1/Control.MiniMap.css" />
    <link rel="stylesheet" href="https://ppete2.github.io/Leaflet.PolylineMeasure/Leaflet.PolylineMeasure.css" />

    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
        
        /* --- NOWY, IDEALNY STYL LEGENDY (Flexbox) --- */
        .legend { 
            background: white; 
            padding: 12px;         /* Więcej oddechu */
            color: #333; 
            border-radius: 8px;    /* Ładniejsze zaokrąglenie */
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            font-family: Arial, sans-serif; 
            font-size: 13px;
            min-width: 140px;      /* Stała szerokość, żeby nie skakało */
        }
        
        .legend h4 { 
            margin: 0 0 10px 0;    /* Odstęp pod tytułem */
            font-size: 15px; 
            font-weight: bold;
            border-bottom: 1px solid #eee; /* Linia oddzielająca tytuł */
            padding-bottom: 5px;
        }

        /* Kontener dla każdego wiersza (kółko + tekst) */
        .legend div {
            display: flex;          /* Układaj w rzędzie */
            align-items: center;    /* Centruj pionowo idealnie */
            margin-bottom: 6px;     /* Odstęp między wierszami */
        }

        /* Styl kółeczka */
        .legend i { 
            width: 16px;            /* Większe kółka */
            height: 16px; 
            margin-right: 10px;     /* Odstęp od tekstu */
            border-radius: 50%; 
            border: 2px solid white; 
            box-shadow: 0 0 3px rgba(0,0,0,0.4); /* Lekki cień kółka */
            flex-shrink: 0;         /* Zapobiega zgniataniu kółka */
        }

        /* --- Styl dla OSM Pickera (żeby ikonka była widoczna) --- */
        .leaflet-control-osmdatapicker {
            background-image: url('assets/openstreetmap.svg') !important;
            background-size: 24px 24px;
            background-repeat: no-repeat;
            background-position: center;
            background-color: white !important;
            width: 34px !important; height: 34px !important;
            border: 2px solid #ccc; border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.65);
            cursor: pointer;
        }
        #osmdatapicker-dialog { z-index: 9999 !important; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="leaflet-osmdatapicker.js"></script>

    <script src="https://unpkg.com/leaflet-search@2.9.8/dist/leaflet-search.src.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-minimap/3.6.1/Control.MiniMap.js"></script>
    <script src="https://ppete2.github.io/Leaflet.PolylineMeasure/Leaflet.PolylineMeasure.js"></script>

    <script>
        // --- DANE GEOJSON ---
        var komercyjneGeoJSON = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "nazwa": "Warszawa Chopin", "kod": "EPWA", "opis": "Największe lotnisko w Polsce." }, "geometry": { "type": "Point", "coordinates": [20.9671, 52.1657] } },
                { "type": "Feature", "properties": { "nazwa": "Kraków Balice", "kod": "EPKK", "opis": "Międzynarodowy port lotniczy." }, "geometry": { "type": "Point", "coordinates": [19.7848, 50.0777] } },
                { "type": "Feature", "properties": { "nazwa": "Gdańsk Rębiechowo", "kod": "EPGD", "opis": "Port im. Lecha Wałęsy." }, "geometry": { "type": "Point", "coordinates": [18.4662, 54.3776] } },
                { "type": "Feature", "properties": { "nazwa": "Katowice Pyrzowice", "kod": "EPKT", "opis": "Lotnisko czarterowe." }, "geometry": { "type": "Point", "coordinates": [19.0800, 50.4743] } },
                { "type": "Feature", "properties": { "nazwa": "Warszawa Modlin", "kod": "EPMO", "opis": "Lotnisko niskokosztowe." }, "geometry": { "type": "Point", "coordinates": [20.6518, 52.4511] } },
                { "type": "Feature", "properties": { "nazwa": "Wrocław Strachowice", "kod": "EPWR", "opis": "Port Lotniczy Wrocław." }, "geometry": { "type": "Point", "coordinates": [16.8858, 51.1027] } },
                { "type": "Feature", "properties": { "nazwa": "Poznań Ławica", "kod": "EPPO", "opis": "Jeden z najstarszych portów." }, "geometry": { "type": "Point", "coordinates": [16.8263, 52.4210] } },
                { "type": "Feature", "properties": { "nazwa": "Rzeszów Jasionka", "kod": "EPRZ", "opis": "Węzeł cargo." }, "geometry": { "type": "Point", "coordinates": [22.0187, 50.1100] } },
                { "type": "Feature", "properties": { "nazwa": "Szczecin Goleniów", "kod": "EPSC", "opis": "Północny zachód." }, "geometry": { "type": "Point", "coordinates": [14.9022, 53.5847] } },
                { "type": "Feature", "properties": { "nazwa": "Lublin Świdnik", "kod": "EPLB", "opis": "Port Lotniczy Lublin." }, "geometry": { "type": "Point", "coordinates": [22.7136, 51.2403] } },
                { "type": "Feature", "properties": { "nazwa": "Bydgoszcz Szwederowo", "kod": "EPBY", "opis": "Port im. Paderewskiego." }, "geometry": { "type": "Point", "coordinates": [17.9777, 53.0968] } },
                { "type": "Feature", "properties": { "nazwa": "Łódź Lublinek", "kod": "EPLL", "opis": "Port im. Reymonta." }, "geometry": { "type": "Point", "coordinates": [19.3981, 51.7219] } },
                { "type": "Feature", "properties": { "nazwa": "Olsztyn Mazury", "kod": "EPSY", "opis": "Szymany." }, "geometry": { "type": "Point", "coordinates": [20.9377, 53.4819] } },
                { "type": "Feature", "properties": { "nazwa": "Zielona Góra Babimost", "kod": "EPZG", "opis": "Port regionalny." }, "geometry": { "type": "Point", "coordinates": [15.7986, 52.1385] } },
                { "type": "Feature", "properties": { "nazwa": "Radom Sadków", "kod": "EPRA", "opis": "Warszawa-Radom." }, "geometry": { "type": "Point", "coordinates": [21.2130, 51.3888] } }
            ]
        };

        var aerokluboweGeoJSON = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "nazwa": "Warszawa Babice", "kod": "EPBC", "opis": "Lotnisko szkoleniowe." }, "geometry": { "type": "Point", "coordinates": [20.9126, 52.2685] } },
                { "type": "Feature", "properties": { "nazwa": "Płock", "kod": "EPPL", "opis": "Aeroklub Ziemi Mazowieckiej." }, "geometry": { "type": "Point", "coordinates": [19.7214, 52.5622] } },
                { "type": "Feature", "properties": { "nazwa": "Bielsko-Biała", "kod": "EPBA", "opis": "Szybowcowa stolica Polski." }, "geometry": { "type": "Point", "coordinates": [19.0069, 49.8056] } },
                { "type": "Feature", "properties": { "nazwa": "Żar", "kod": "EPZR", "opis": "Górska Szkoła Szybowcowa." }, "geometry": { "type": "Point", "coordinates": [19.2231, 49.7733] } },
                { "type": "Feature", "properties": { "nazwa": "Nowy Targ", "kod": "EPNT", "opis": "Najwyżej położone lotnisko." }, "geometry": { "type": "Point", "coordinates": [20.0503, 49.4636] } },
                { "type": "Feature", "properties": { "nazwa": "Leszno", "kod": "EPLS", "opis": "Słynne lotnisko szybowcowe." }, "geometry": { "type": "Point", "coordinates": [16.5147, 51.8361] } },
                { "type": "Feature", "properties": { "nazwa": "Toruń", "kod": "EPTO", "opis": "Aeroklub Pomorski." }, "geometry": { "type": "Point", "coordinates": [18.5458, 53.0297] } },
                { "type": "Feature", "properties": { "nazwa": "Jastarnia", "kod": "EPJA", "opis": "Lądowisko trawiaste na Helu." }, "geometry": { "type": "Point", "coordinates": [18.6791, 54.7103] } },
                { "type": "Feature", "properties": { "nazwa": "Suwałki", "kod": "EPSU", "opis": "Aeroklub Suwalski." }, "geometry": { "type": "Point", "coordinates": [22.8989, 54.0725] } },
                { "type": "Feature", "properties": { "nazwa": "Kielce Masłów", "kod": "EPKA", "opis": "Aeroklub Kielecki." }, "geometry": { "type": "Point", "coordinates": [20.7297, 50.8967] } },
                { "type": "Feature", "properties": { "nazwa": "Mielec", "kod": "EPML", "opis": "Lotnisko przyszłościowe." }, "geometry": { "type": "Point", "coordinates": [21.4633, 50.3222] } },
                { "type": "Feature", "properties": { "nazwa": "Jelenia Góra", "kod": "EPJG", "opis": "Aeroklub Jeleniogórski." }, "geometry": { "type": "Point", "coordinates": [15.7939, 50.8986] } },
                { "type": "Feature", "properties": { "nazwa": "Arłamów", "kod": "EPAR", "opis": "Lądowisko hotelowe." }, "geometry": { "type": "Point", "coordinates": [22.5142, 49.6583] } }
            ]
        };

        var historyczneGeoJSON = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "nazwa": "Warszawa Mokotów", "opis": "Od 1920 obsługiwało regularne loty. Obecnie park." }, "geometry": { "type": "Point", "coordinates": [21.0000, 52.2100] } },
                { "type": "Feature", "properties": { "nazwa": "Gdańsk Wrzeszcz", "opis": "Do 1974. Obecnie osiedle." }, "geometry": { "type": "Point", "coordinates": [18.6100, 54.3900] } },
                { "type": "Feature", "properties": { "nazwa": "Kraków Rakowice-Czyżyny", "opis": "1924-1963. Obecnie Muzeum." }, "geometry": { "type": "Point", "coordinates": [19.9900, 50.0760] } },
                { "type": "Feature", "properties": { "nazwa": "Gdynia w Rumi-Zagórzu", "opis": "1935-1939. Loty PLL LOT." }, "geometry": { "type": "Point", "coordinates": [18.4300, 54.5700] } },
                { "type": "Feature", "properties": { "nazwa": "Wrocław Gądów Mały", "opis": "Do 1958. Obecnie osiedle." }, "geometry": { "type": "Point", "coordinates": [16.9700, 51.1200] } },
                { "type": "Feature", "properties": { "nazwa": "Szczecin Dąbie", "opis": "Pasażerskie do 1968 roku." }, "geometry": { "type": "Point", "coordinates": [14.6300, 53.3900] } },
                { "type": "Feature", "properties": { "nazwa": "Katowice Muchowiec (Hist.)", "opis": "Ruch pasażerski 1929-1958." }, "geometry": { "type": "Point", "coordinates": [19.0342, 50.2381] } },
                { "type": "Feature", "properties": { "nazwa": "Olsztyn Dajtki (Hist.)", "opis": "Przed II WŚ Lufthana, po wojnie LOT." }, "geometry": { "type": "Point", "coordinates": [20.4239, 53.7744] } },
                { "type": "Feature", "properties": { "nazwa": "Koszalin Zegrze", "opis": "Ruch pasażerski 1965-1991." }, "geometry": { "type": "Point", "coordinates": [16.2600, 54.0400] } },
                { "type": "Feature", "properties": { "nazwa": "Słupsk Redzikowo", "opis": "Loty pasażerskie do lat 90." }, "geometry": { "type": "Point", "coordinates": [17.1000, 54.4700] } },
                { "type": "Feature", "properties": { "nazwa": "Białystok Krywlany (Hist.)", "opis": "Krótki epizod pasażerski po 1945." }, "geometry": { "type": "Point", "coordinates": [23.1731, 53.1044] } },
                { "type": "Feature", "properties": { "nazwa": "Częstochowa Rudniki (Hist.)", "opis": "Sezonowe połączenie LOT w 1983." }, "geometry": { "type": "Point", "coordinates": [19.2056, 50.8847] } }
            ]
        };

        // --- MAPA GŁÓWNA ---
        var map = L.map('map').setView([52.00, 19.00], 6);

        // Podkłady
        var osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
        var esriSatelita = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri' });
        var openTopo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '© OpenTopoMap' });

        // Funkcje stylizacji
        function onEachPopup(feature, layer) {
            layer.bindPopup("<b>" + feature.properties.nazwa + "</b><br>" + (feature.properties.kod ? "Kod: " + feature.properties.kod + "<br>" : "") + "<i>" + feature.properties.opis + "</i>");
        }
        function styleK(f, l) { return L.circleMarker(l, { radius: 8, fillColor: "#d63031", color: "#fff", weight: 2, fillOpacity: 0.9 }); }
        function styleA(f, l) { return L.circleMarker(l, { radius: 6, fillColor: "#0984e3", color: "#fff", weight: 2, fillOpacity: 0.8 }); }
        function styleH(f, l) { return L.circleMarker(l, { radius: 7, fillColor: "#636e72", color: "#2d3436", weight: 2, fillOpacity: 0.8 }); }

        // Tworzenie warstw
        var layerKomercyjne = L.geoJSON(komercyjneGeoJSON, { pointToLayer: styleK, onEachFeature: onEachPopup });
        var layerAeroklubowe = L.geoJSON(aerokluboweGeoJSON, { pointToLayer: styleA, onEachFeature: onEachPopup });
        var layerHistoryczne = L.geoJSON(historyczneGeoJSON, { pointToLayer: styleH, onEachFeature: onEachPopup });

        // Dodanie warstw na start
        layerKomercyjne.addTo(map);
        layerHistoryczne.addTo(map);

        // Grupa do wyszukiwarki
        var wszystkieLotniska = L.layerGroup([layerKomercyjne, layerAeroklubowe, layerHistoryczne]);

        // Panel Warstw
        L.control.layers(
            { "Mapa Drogowa": osmStandard, "Satelita": esriSatelita, "Topograficzna": openTopo },
            { "<span style='color:#d63031; font-weight:bold'>Pasażerskie</span>": layerKomercyjne,
              "<span style='color:#0984e3; font-weight:bold'>Aeroklubowe</span>": layerAeroklubowe,
              "<span style='color:#636e72; font-weight:bold'>Historyczne</span>": layerHistoryczne }
        ).addTo(map);

        // --- LEGENDA (POPRAWIONA) ---
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<h4>Legenda</h4>';
            // Każdy element w osobnym DIVie, żeby Flexbox zadziałał
            div.innerHTML += '<div><i style="background: #d63031;"></i> Pasażerskie</div>';
            div.innerHTML += '<div><i style="background: #0984e3;"></i> Aeroklubowe</div>';
            div.innerHTML += '<div><i style="background: #636e72;"></i> Historyczne</div>';
            return div;
        };
        legend.addTo(map);

        // ==========================================
        //  DODATKI (WTYCZKI)
        // ==========================================

        // 1. WYSZUKIWARKA
        var searchControl = new L.Control.Search({
            layer: wszystkieLotniska,
            propertyName: 'nazwa',
            marker: false,
            moveToLocation: function(latlng, title, map) { map.setView(latlng, 14); }
        });
        map.addControl(searchControl);

        // 2. MINIMAPA
        var miniMapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
        var miniMap = new L.Control.MiniMap(miniMapLayer, { toggleDisplay: true, minimized: false }).addTo(map);

        // 3. LINIJKA
        L.control.polylineMeasure({
            position: 'topleft',
            unit: 'metres',
            showBearings: false,
            clearMeasurementsOnStop: false,
            showClearControl: true,
            showUnitControl: true
        }).addTo(map);

        // 4. OSM DATA PICKER
        L.OSMDataPicker.addControl(map);

    </script>
</body>
</html>
