<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoportal Lotnisk</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="osmdatapicker-page.css" />

    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
        
        /* --- STYLE OGÓLNE --- */
        .legend { background: white; padding: 10px; color: #333; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); font-family: Arial, sans-serif; font-size: 13px; }
        .legend i { width: 14px; height: 14px; float: left; margin-right: 8px; margin-top: 3px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 2px #000; }
        
        /* --- RATUNEK DLA IKONKI WTYCZKI --- */
        /* To naprawia problem z niewidocznym przyciskiem */
        .leaflet-control-osmdatapicker {
            background-image: url('assets/openstreetmap.svg') !important; /* Wymuszamy ścieżkę do assets */
            background-size: 24px 24px;
            background-repeat: no-repeat;
            background-position: center;
            background-color: white !important; /* Białe tło, żeby było widać przycisk */
            box-shadow: 0 1px 5px rgba(0,0,0,0.65); /* Cień jak w innych przyciskach */
            border-radius: 5px;
            width: 34px !important;
            height: 34px !important;
            border: 2px solid #ccc; /* Szara ramka dla pewności */
            cursor: pointer;
        }
        
        /* Naprawa okna dialogowego */
        #osmdatapicker-dialog { z-index: 9999 !important; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="leaflet-osmdatapicker.js"></script>

    <script>
        // DANE
        var komercyjneGeoJSON = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "nazwa": "Warszawa Chopin", "kod": "EPWA" }, "geometry": { "type": "Point", "coordinates": [20.9671, 52.1657] } },
                { "type": "Feature", "properties": { "nazwa": "Kraków Balice", "kod": "EPKK" }, "geometry": { "type": "Point", "coordinates": [19.7848, 50.0777] } },
                { "type": "Feature", "properties": { "nazwa": "Gdańsk Rębiechowo", "kod": "EPGD" }, "geometry": { "type": "Point", "coordinates": [18.4662, 54.3776] } },
                { "type": "Feature", "properties": { "nazwa": "Katowice Pyrzowice", "kod": "EPKT" }, "geometry": { "type": "Point", "coordinates": [19.0800, 50.4743] } },
                { "type": "Feature", "properties": { "nazwa": "Wrocław Strachowice", "kod": "EPWR" }, "geometry": { "type": "Point", "coordinates": [16.8858, 51.1027] } }
            ]
        };

        var aerokluboweGeoJSON = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "nazwa": "Warszawa Babice", "kod": "EPBC" }, "geometry": { "type": "Point", "coordinates": [20.9126, 52.2685] } },
                { "type": "Feature", "properties": { "nazwa": "Jastarnia", "kod": "EPJA" }, "geometry": { "type": "Point", "coordinates": [18.6791, 54.7103] } },
                { "type": "Feature", "properties": { "nazwa": "Arłamów", "kod": "EPAR" }, "geometry": { "type": "Point", "coordinates": [22.5142, 49.6583] } }
            ]
        };

        // INICJALIZACJA
        var map = L.map('map').setView([52.00, 19.00], 6);

        var osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(map);

        // STYLE
        function styleK(feature, latlng) { return L.circleMarker(latlng, { radius: 8, fillColor: "#d63031", color: "#fff", weight: 2, fillOpacity: 0.9 }); }
        function styleA(feature, latlng) { return L.circleMarker(latlng, { radius: 6, fillColor: "#0984e3", color: "#fff", weight: 2, fillOpacity: 0.8 }); }

        var layerKomercyjne = L.geoJSON(komercyjneGeoJSON, { pointToLayer: styleK, onEachFeature: function(f,l){l.bindPopup(f.properties.nazwa)} });
        var layerAeroklubowe = L.geoJSON(aerokluboweGeoJSON, { pointToLayer: styleA, onEachFeature: function(f,l){l.bindPopup(f.properties.nazwa)} });

        layerKomercyjne.addTo(map);
        layerAeroklubowe.addTo(map);

        L.control.layers({"OSM": osmStandard}, {"Komercyjne": layerKomercyjne, "Aeroklubowe": layerAeroklubowe}).addTo(map);
        
        // LEGENDA
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<h4>Legenda</h4>';
            div.innerHTML += '<i style="background: #d63031;"></i> Komercyjne<br>';
            div.innerHTML += '<i style="background: #0984e3;"></i> Aeroklubowe<br>';
            return div;
        };
        legend.addTo(map);

        // --- DODANIE WTYCZKI ---
        // Dodajemy ją i logujemy w konsoli, czy się udało
        var picker = L.OSMDataPicker.addControl(map);
        console.log("Wtyczka dodana:", picker);

    </script>
</body>
</html>
